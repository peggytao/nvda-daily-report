name: Daily NVDA Report

on:
  schedule:
    - cron: '0 13 * * *'   # Runs daily at 13:00 UTC (9AM EST)
  workflow_dispatch:       # Allows manual run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true   # ensures GITHUB_TOKEN can push
        fetch-depth: 0             # full history for commits

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install yfinance feedparser

    - name: Run report script
      run: python report.py

    - name: Commit updated report
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Daily NVDA update" || echo "No changes"
        git push origin HEAD:main
      env:
        # GitHub automatically provides this secret
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
